[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions.getSectorData]
  timeout = 300
```

**Important:** The last 2 lines (`[functions.getSectorData]` and `timeout = 300`) set the timeout to **5 minutes** (300 seconds).

5. **Scroll down**
6. **Commit message:** "Increase function timeout to 5 minutes"
7. **Click "Commit changes"**

---

### **Step 2: Wait for Redeploy**

1. **Wait 1 minute** for Netlify to auto-deploy
2. **Check Netlify** → Deploys tab
3. **Wait for "Published"** status

---

### **Step 3: Test Your Dashboard**

1. **Go to your dashboard** URL
2. **Click "🔄 Refresh Data"**
3. **Wait 1-2 minutes** (5 sectors × 12 seconds = ~60 seconds + processing time)
4. **Data should appear!** ✅

---

